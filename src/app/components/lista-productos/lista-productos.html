<p-toast></p-toast>
<div class="container-fluid">
    <div class="conten-ppal">
        <div class="row">
            <div class="field col-2">
                <p>Productos:</p>
            </div>
            <div class="field col-8"></div>

            <div class="field col-2">
                <button pButton pRipple type="button" [disabled]="habilitado" label="Consultar" icon="pi pi-search"
                    iconPos="left" class="p-button-success" [style]="{'width':'15vw','height':'6vh'}"
                    (click)="funct_retorna_productos();"></button>
            </div>
        </div>
        <hr>
        <div class="card" *ngIf="visible">
            <p-progressBar mode="indeterminate" styleClass="my-custom-style" [style]="{'width':'100%'}"></p-progressBar>
        </div>
        <div class="row mt-2">
            <div class="field col-12">
                <p-table [value]="data" styleClass="p-datatable-sm p-datatable-striped p-datatable-gridlines"
                    class="custom-table" [tableStyle]="{ 'min-width':'50rem'}" [scrollable]="true" scrollHeight="67vh"
                    dataKey="codProd" [paginator]="false" [rows]="10" [rowsPerPageOptions]="[50,100]"
                    [showCurrentPageReport]="true"
                    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
                    selectionMode="single">
                    <ng-template pTemplate="caption">
                        <p-columnFilter type="text" field="descripcion" [showMenu]="true"
                            [matchMode]="'contains'"></p-columnFilter>
                    </ng-template>
                    <ng-template pTemplate="header">
                        <tr>
                            <th style="width: 100px;">Código producto</th>
                            <th style="width: 300px;">Descripción</th>
                            <th style="width: 50px;" class="centered">Existencia</th>
                            <th style="width: 150px;">Precio venta</th>
                            <th style="width: 150px;">Fecha creación</th>
                            <th style="width: 150px;">Fecha ultimo toque</th>
                            <th style="width: 100px;" class="centered">Acción</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate="body" let-dataProductos>
                        <tr>
                            <td style="width: 100px;">{{dataProductos.codProd}}</td>
                            <td style="width: 300px;">{{dataProductos.descripcion}}</td>
                            <td style="width: 50px;" class="centered">{{dataProductos.existencia}}</td>
                            <td style="width: 150px;">{{dataProductos.precio_venta | currency: 'USD'}}</td>
                            <td style="width: 150px;">{{dataProductos.createAt}}</td>
                            <td style="width: 150px;">{{dataProductos.updated_at}}</td>
                            <td style="flex: 5rem 5rem 5rem" class="centered">
                                <button pButton pRipple type="button"
                                    class="p-button-rounded p-button-text p-button-plain p-button-sm p-button2 pi pi-trash"
                                    (click)="funct_elimina_productos(dataProductos);"></button>
                            </td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
</div>
